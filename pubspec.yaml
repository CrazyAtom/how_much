name: how_much
description: 'A application with Gemini'
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.0.16
  go_router: ^14.6.2
  debounce_throttle: ^2.0.0
  flutter_riverpod: ^2.6.1
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  riverpod_annotation: ^2.6.1
  google_generative_ai: ^0.4.6
  flutter_markdown: ^0.7.4
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  logger: ^2.5.0
  image_picker: ^1.1.2
  fl_chart: ^0.69.2
  intl: ^0.20.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  loading_animation_widget: ^1.3.0
  google_fonts: ^6.2.1
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  freezed: ^2.5.7
  riverpod_generator: ^2.6.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - asset/images/logo/
    - .env.development
    - .env.production

  fonts:
    - family: Pretendard
      fonts:
        - asset: asset/fonts/Pretendard/Pretendard-Thin.otf
          weight: 100
        - asset: asset/fonts/Pretendard/Pretendard-ExtraLight.otf
          weight: 200
        - asset: asset/fonts/Pretendard/Pretendard-Light.otf
          weight: 300
        - asset: asset/fonts/Pretendard/Pretendard-Regular.otf
          weight: 400
        - asset: asset/fonts/Pretendard/Pretendard-Medium.otf
          weight: 500
        - asset: asset/fonts/Pretendard/Pretendard-SemiBold.otf
          weight: 600
        - asset: asset/fonts/Pretendard/Pretendard-Bold.otf
          weight: 700
        - asset: asset/fonts/Pretendard/Pretendard-ExtraBold.otf
          weight: 800
        - asset: asset/fonts/Pretendard/Pretendard-Black.otf
          weight: 900
